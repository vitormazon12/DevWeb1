<!DOCTYPE html>
<html>
    <head>
        <title>Formulários</title>
    </head>

    <body>

        <form action="" method="GET" enctype="multipart/form-data">
            <!---- action serve para onde está enviando o formulario: um 
                GET fica na url como referência de acesso a página e o 
                POST não fica na url da pagina, bom para dados sensíveis-->
            
            <label for="id_nome">*Nome:</label>
            <input id="id_nome" name="nome" required maxlength="50" minlength="5">
            
            <br>
            <label for="id_idade">Idade:</label>
            <input type="number" id="id_idade" name="idade" min="0" max="122">

            <br>
            <label for="id_nascimento">Data de Nascimento</label>
            <input type="date" id="id_nascimento" name="nascimento" max="2026-09-05">

            <br>
            <label for="id_hora">Hora</label>
            <input type="time" id="id_hora" name="hora" min="09:00" max="17:00">

            <br>
            <label for="id_datetime">Data e Hora:</label>
            <input type="datetime-local" id="id_datetime" nome="datetime" min="2026-09-05T11:00">

            <br>
            <label for="id_range">Range</label>
            <input type="range" id="id_range" name="range" min="0" max="10" step="0.5">

            <br>
            <label for="id_email">E-mail</label>
            <input type="email" id="id_email" name="email">

            <br>
            <label for="id_url">URL</label>
            <input type="url" id="id_url" name="url">

            <br>
            <label for="id_senha">Senha:</label>
            <input type="password" id="id_senha" name="senha" pattern=".{8,}">

            <br> <!--Pesquisar expressão regular para telefone-->
            <label for="id_tel">Telefone:</label>
            <input type="tel" id="id_tel" name="telefone" pattern="^(?:\(?([1-9]{2})\)?\s?)?(?:9[0-9]{4}|[2-8][0-9]{3})\-?[0-9]{4}">

            <br> <!--Campo de texto longo-->
            <label for="id_resumo">Resumo</label>
            <textarea id="id_resumo" name="resumo" rows="10" cols="50"></textarea>

            <br>
            <input type="checkbox" value="S" name="acordo" id="id_acordo">
            <label for="id_acordo">Estou de acordo</label>
            <br>

            <hr>
            <p>Escolha o radio:</p>
            <input type="radio" id="id_radio1" name="radio" value="">
            <label for="id_radio1">Radio 1</label>
            <input type="radio" id="id_radio2" name="radio" value="">
            <label for="id_radio2">Radio 2</label>
            <input type="radio" name="radio" id="id_radio3" value="">
            <label for="id_radio3">Radio 3</label>
            <hr>
            <br>

            <label for="id_cidade">*Cidade</label>
            <select id="id_cidade" name="cidade" required>
                <option></option>
                <option value="A" >Araras</option><!--<option value="A" selected> é para aparecer préselecionado esse valor-->
                <option value="L">Leme</option>
                <option value="R">Rio Claro</option>
            </select>
            
            <br> <!--Pula uma linha-->
            <button type="submit">Enviar</button>
        </form>
        
    </body>
</html>
