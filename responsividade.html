<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsividade</title>

    <style>
        *, *::before *::after {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        div{
            background-color: blue;
            width: 80%;
            height: 75px;
            margin: 5px;
            display: inline-block;
        }

        @media screen and (min-width: 768px) {
            div {
                width: 40%;
                background-color: brown;
            }
        }

        @media  screen and (min-width: 992px) {
            div{
                width: 30%;
                background-color: green;
            }
        }

        img, video {
            max-width: 100%; /* A imagem ou vídeo ocupa a tela toda */
            height: auto;
            display: block; /* Para ela ficar parada no lugar sem ser preenchida por nada e nem sobrepor */
        }
    </style>
</head>
<body>
    
    <header>
        <h1>Responsivo</h1>
    </header>

    <main>
        <div></div>
        <div></div>
        <div></div>
    </main>
</body>
</html>
