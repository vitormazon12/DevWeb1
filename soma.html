<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript 1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <style>
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 10px;
        }

        form .conta {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
    </style>

</head>

<body>
    <div class="container">
        <form id="formulario">
            <div class="conta">
                <input type="number" name="item1" id="item1" class="form-control">
                +
                <input type="number" name="item2" id="item2" class="form-control">
                =
                <div id="resultado">Sem resultado</div>
            </div>

            <button type="button" class="btn" id="botao">Calcular</button>

        </form>
    </div>

    <script>

        var botao = document.getElementById("botao");
        botao.addEventListener("click", function() {
            let item1 = document.getElementById("item1").value;
            let item2 = document.getElementById("item2").value;

            let resultado = Number(item1) + Number(item2);
            
            let resposta = document.getElementById("resultado");
            resposta.innerHTML = resultado;
        })
       

    </script>

</body>

</html>
