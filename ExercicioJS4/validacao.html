<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação</title>
</head>
<body>
    <form method="GET" id="formulario">
        <label for="item1">Item 1: </label>
        <input type="number" name="item1" id="item1">

        <br>
        <label for="item2">Item 2: </label>
        <input type="number" name="item2" id="item2">

        <br>
        <button type="submit">Enviar</button>

    </form>

    <script>
        var formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", function(evento){
            evento.preventDefault();

            let item1 = document.getElementById("item1").value;
            let item2 = document.getElementById("item2").value;

            if(item1 >= item2){
                window.alert("Item 2 deve ser maior que o Item 1");
            }
            else{
                formulario.submit();
            }
        });
    </script>
</body>
</html>
