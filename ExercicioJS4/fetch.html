<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Criar post</h1>

    <form>
        <label for="title">Titulo</label><br>
        <input type="text" name="title" id="title" required>
        <br><br>
        <label for="body">Mensagem</label><br>
        <textarea name="body" id="body" cols="100" rows="10" required>
        </textarea>
        <br><br>
        <label for="userId">Mensagem</label><br>
        <select id="userId" name="userId" required>
            <option value="">Selecione um usuário</option>
        </select>
        <br><br>
        <button type="button" id="botao">Incluir post</button>
    </form>

    <script>

        var botao = document.getElementById("botao");
        botao.addEventListener("click", function(){
            let title = document.getElementById("title").value;
            let body = document.getElementById("body").value;
            let userId = document.getElementById("userId").value;

            fetch('https://jsonplaceholder.typicode.com/posts', {
                    method: 'POST',
                    body: JSON.stringify({
                        title: title,
                        body: body,
                        userId: userId,
                    }),
                    headers: {
                        'Content-type': 'application/json; charset=UTF-8',
                    },
                })
                .then(response => response.json())
                .then(json => console.log(json))
        })

        const url = 'https://jsonplaceholder.typicode.com/users';

        fetch(url)
        .then(resposta => {
            if (!resposta.ok) {
                throw new Error(`Erro HTTP: ${resposta.status}`);
            }
            return resposta.json(); // Retorna uma Promise com o JSON convertido
        })
        .then(dados => {
            console.log(dados); // Aqui você usa os dados
       
            let select = document.getElementById("userId");
            for (dado of dados) {
                let option = document.createElement("option");
                option.value = dado["id"];
                option.textContent = dado["name"];
                select.append(option);                
            }
        })
        .catch(erro => {
            console.error('Erro na requisição:', erro);
        });
    </script>
</body>
</html>
