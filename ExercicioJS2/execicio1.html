<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome">

        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade">

        <button type="button" id="botao">Gerar</button>

        <p>
            Meu nome é <span id="span_nome">????????</span>, e tenho <span id="span_idade">??</span> anos.
        </p>
    </form>

    <script>
        var botao = document.getElementById("botao");

        function mostra_dados(){
            let nome = document.getElementById("nome").value;
            let idade = document.getElementById("idade").value;
            
            let mostra_nome = document.getElementById("span_nome");
            mostra_nome.innerHTML = nome;

            let mostra_idade = document.getElementById("span_idade");
            mostra_idade.innerHTML = idade;
        };

        botao.addEventListener("click", mostra_dados);

            let mostra_idade = document.getElementById("span_idade");
            mostra_idade.innerHTML = idade;
        }) */

    </script>

</body>
</html>
